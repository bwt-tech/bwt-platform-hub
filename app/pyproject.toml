[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bwt-contrib-integrator"
version = "0.1.0"
description = "Integration hub microservice for third-party services (Meta, Google, RDStation, Octadesk, etc.)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic[email]>=2.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "boto3>=1.34.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "anyio[trio]>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "respx>=0.21.0",
    "moto[secretsmanager,ssm]>=5.0.0",
    "pytest-mock>=3.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
addopts = "--cov=app/src --cov=app/main.py --cov-fail-under=100 --cov-report=term-missing"

[tool.coverage.run]
source = ["app/src", "app/main.py"]
omit = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
